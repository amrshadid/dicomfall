# The curriculum, in play order. A chapter's stage number is its place in this list.
# A chapter's Codex title page: `story` (the stage in a few lines), `guide` (the character from
# the standard who guides it), `standsFor` (the part of DICOM it is about) and `outcomes` (the
# "You can now…" lines shown once every mission of the stage is completed).
# Its `regions` group its missions in play order, each under its own heading on the map:
# `caption` (what the missions cover), `guide` (who speaks in them), `source` (where that lives in
# go-dicom and the standard) and `missions` (their ids, so folders and ids stay as they are).
#
# DRAFT: every `story` and `outcomes` below is placeholder text, to be rewritten once the stage's
# missions are written against real runs.
#
# A region lists the missions it holds and the game checks they exist, so no region can be
# written before its first mission. Each stage's regions from the first draft are kept as a
# comment under it, and move into `regions:` with their first mission.
chapters:
  # stage 1
  - id: the-first-file
    title: The First File
    summary: What a DICOM file holds, read with go-dicom and as bytes, its four regions, and the one element that says how to read the rest.
    story: >-
      One synthetic CT slice has to reach the archive tonight, and nobody sends a file they cannot
      read. The Preamble, 128 bytes with nothing in them, shows you the file through go-dicom, then
      as bytes: where it starts, how it says it is DICOM, how it describes itself, and which element
      tells a reader how to read the rest. Then a second file arrives, and reads differently.
    guide: The Preamble
    standsFor: Part 10, the file format
    outcomes:
      - find the four regions of any DICOM file
      - read where the object starts from its group length
      - read a file's transfer syntax and say what it decides
    regions:
      - id: open-the-file
        name: Open the file
        caption: what a DICOM file holds, read with go-dicom and as bytes
        guide: The Preamble
        source: cli/show.go, cli/info.go, PS3.10 §7
        missions: [what-the-file-says, under-the-words]
      - id: the-four-regions
        name: The four regions
        caption: the preamble, the DICM prefix, the File Meta Information and the Data Set
        guide: The Preamble
        source: filereader/, PS3.10 §7.1
        missions: [empty-bytes, the-envelope]
      - id: the-transfer-syntax
        name: The transfer syntax
        caption: the Transfer Syntax UID, UIDs, and little endian
        guide: The Preamble
        source: filereader/, uid/, PS3.10 §7.1, PS3.5 §7.3, §9, §10
        missions: [how-to-read-the-rest, a-second-file]
  # end of stage 1
  # stage 2
  - id: the-elements
    title: The Elements
    summary: One element opened byte by byte, its tag, VR, length and values, then the same elements with no VR, and elements that hold other elements.
    story: >-
      The Data Set is a run of elements, and VR, the two letters that say how a value is written,
      opens one of them at a time: its tag, its VR, its length, the long form some VRs use, and
      values that come several to an element. Then the second file, which writes no VR at all, and
      the same object in two encodings side by side. Then the one element that holds other
      elements. At the end, you read any element by hand.
    guide: VR
    standsFor: Part 5, data structures and encoding
    outcomes:
      - read any element's tag, VR, length and value by hand
      - predict where the next element starts, in explicit or implicit VR
      - find a sequence's items and the elements inside them
    regions:
      - id: tag-vr-length
        name: Tag, VR, length
        caption: an element's tag, its VR, its length and its values
        guide: VR
        source: filereader/, tag/, valuerep/, PS3.5 §6.2, §6.4, §7.1
        missions: [four-bytes-of-name, two-letters-and-a-length, the-long-form, one-name-many-values]
      - id: explicit-and-implicit
        name: Explicit and implicit
        caption: elements without VR letters, and one object in two encodings
        guide: VR
        source: filereader/, tag/, PS3.5 §7.1.3, §10.1, Annex A
        missions: [no-letters, the-same-object-twice]
      - id: sequences
        name: Sequences
        caption: sequences, items and their delimiters
        guide: VR
        source: sequence/, filereader/, PS3.5 §7.5
        missions: [elements-inside-elements, read-any-element]
  # end of stage 2
  - id: the-object
    title: The object
    summary: Study, Series and SOP Instance UIDs, SOP Classes, and the pixel attributes.
    story: Every file belongs to a series and a study, and says what kind of object it is. Its pixel attributes describe the image.
    guide: The Instance UID
    standsFor: Part 3's information model and Part 4's storage SOP Classes
    outcomes:
      - sort files into studies and series by their UIDs
      - tell an instance's identity from its storage class
      - read how Rows, Columns and the pixel encoding describe an image
    # Regions, first draft, all guided by The Instance UID (PS3.3, PS3.4):
    #   study-series-instance      Study, Series, Instance
    #   sop-class-and-instance     SOP Class and instance
    #   the-pixel-attributes       The pixel attributes
  - id: the-bridge
    title: Bridge
    label: Bridge
    summary: The same SOP Instance UID on disk and on the wire.
    story: The CT is about to leave the disk. The object stays the same; what wraps it changes.
    guide: The Instance UID
    standsFor: Part 10's File Meta Information beside Part 7's Command Set
    outcomes:
      - tell the File Meta Information from the DIMSE Command Set
      - say how the negotiated transfer syntax decides how a sent Data Set is encoded
    # Regions, first draft, guided by The Instance UID (PS3.10, PS3.7):
    #   on-disk-and-on-the-wire    On disk and on the wire
  - id: the-association
    title: The association
    summary: Application entities, AE titles, SCU and SCP roles, and presentation contexts.
    story: Two AEs have to agree before anything is sent. The receiving desk is polite, and strict about what it accepts.
    guide: The SCP
    standsFor: Part 8, the network, and Part 7's C-ECHO and C-STORE
    outcomes:
      - connect a sender and a receiver and read what they agreed
      - run C-ECHO, then C-STORE, and prove receipt by UID
    # Regions, first draft, all guided by The SCP (network/pdu.go, PS3.8, PS3.7):
    #   ae-titles-and-roles        AE titles and roles
    #   presentation-contexts      Presentation contexts
    #   echo-then-store            Echo, then store
  - id: query-and-retrieve
    title: Query and retrieve
    summary: C-FIND, C-GET, C-MOVE, status codes and C-STORE sub-operations.
    story: The archive has everything, and answers only a proper query. Getting a study back can take a second association.
    guide: The Archive
    standsFor: Part 4's Query/Retrieve Service Class and Part 7's C-FIND, C-GET and C-MOVE
    outcomes:
      - find a study with C-FIND and retrieve it with C-GET
      - follow C-MOVE to its destination and diagnose a failed move from the evidence
    # Regions, first draft, all guided by The Archive (PS3.4, PS3.7):
    #   ask-the-archive            Ask the archive (C-FIND)
    #   bring-it-here              Bring it here (C-GET)
    #   send-it-there              Send it there (C-MOVE)
    #   status                     Status
  - id: interoperability
    title: Interoperability
    summary: Conformance statements, compressed transfer syntaxes, optional DIMSE-N and DICOMweb.
    story: Two endpoints say what they can do, and are held to it. A refused context is a clue, not a dead end.
    guide: The Conformance Statement
    standsFor: Part 2's conformance statements, Part 5's compressed transfer syntaxes and Part 18, DICOMweb
    outcomes:
      - compare what two endpoints can do
      - explain a rejected presentation context and prove recovery with a successful transfer
    # Regions, first draft, all guided by The Conformance Statement (PS3.2, PS3.5, PS3.18):
    #   conformance                Conformance
    #   compressed-syntaxes        Compressed syntaxes
    #   beyond-c-store             Beyond C-STORE
