# Stage 2, mission 5. From packages/fixtures/out/ct-implicit-le.dcm (go-dicom v1.8.0):
# Patient's Name (0010,0010) at 872: 10 00 10 00, length 0c 00 00 00 at 876-879, value 880-891
# (FALLS^DICOM and a space at 891). Patient ID (0010,0020) at 892.
# Fact-checked 2026-11-14: go-dicom 1.9.0 prints PN in the VR column for the implicit file (the
# recorded `show ::0010,0010`). PS3.5 §10.1: the default transfer syntax "shall be supported by
# every conformant DICOM Implementation", as the story, the Predict and the card say.
id: no-letters
version: 1
title: No Letters
summary: Read an element written with no VR, in Implicit VR Little Endian, and find where the next one starts.
minutes: 15
chapter: the-elements
objective: In the implicit file, mark Patient's Name and its length, and predict where Patient ID starts.
skills: [read-implicit-elements]
prerequisites: [read-multiple-values]
teaches: [explicit-vr, implicit-vr, default-transfer-syntax]
names: [private-tag]
uses: [tag, vr, value-length, long-form, data-dictionary, transfer-syntax, value-padding, offset]

lab:
  aes:
    - { name: workstation, title: WORKSTATION }
  links: []
  files:
    - { fixture: ct-explicit-le.dcm, to: /lab/ct-explicit-le.dcm }
    - { fixture: ct-implicit-le.dcm, to: /lab/ct-implicit-le.dcm }
  console: workstation

objectives:
  - id: name-implicit
    text: Mark the Patient's Name element in the implicit file.
    check: { kind: selected, file: /lab/ct-implicit-le.dcm, element: "(0010,0010)" }
  - id: length-implicit
    text: Mark its length.
    check: { kind: selected, file: /lab/ct-implicit-le.dcm, element: "(0010,0010)", part: length }
  - id: next-implicit
    text: Predict where Patient ID starts in the implicit file.
    check: { kind: offset, file: /lab/ct-implicit-le.dcm, element: "(0010,0020)", offset: 892 }

hints:
  - text: Compare Patient's Name in the two files, byte by byte, in the hex.
  - text: In Implicit VR Little Endian, each element is a tag, a four-byte length and the value. Nothing else.
  - text: In the implicit file, Patient's Name's length is the four bytes right after 10 00 10 00.

chips:
  - { command: go-dicom show, explain: "every element; in an implicit file, the VR is the reader's" }
  - { command: go-dicom tag-doc, explain: "the dictionary entry the reader used" }

codex:
  - id: explicit-vr
    term: explicit VR
    simple: "Each element carries its VR as two letters after the tag. Explicit VR Little Endian is 1.2.840.10008.1.2.1."
    deep: "PS3.5 §7.1.2: in an Explicit VR transfer syntax every Data Element is tag, VR, length, value, and the VR decides whether the length takes 2 bytes or, after 2 reserved bytes, 4. A reader can find where every value ends, and how to read it, without a dictionary, even for an element it has never heard of. Explicit VR Little Endian is defined in PS3.5 Annex A.2."
    deepens: vr
    sources: [filereader/]
    docs: https://dicom.nema.org/medical/dicom/current/output/chtml/part05/chapter_7.html#sect_7.1.2
    tryIt: go-dicom show ct.dcm::0010,0010
  - id: implicit-vr
    term: implicit VR
    simple: "Elements carry no VR: a tag, a four-byte length, the value. The reader takes the VR from the data dictionary."
    deep: "PS3.5 §7.1.3: in Implicit VR every Data Element is a 4-byte tag, a 4-byte length and the value, whatever its VR, so 8 bytes come before every value. The VR is the one the data dictionary, PS3.6, gives the tag. A private element is not in PS3.6, so a reader without its vendor's dictionary can step over its value but cannot know how to read it."
    deepens: explicit-vr
    sources: [filereader/, tag/]
    docs: https://dicom.nema.org/medical/dicom/current/output/chtml/part05/chapter_7.html#sect_7.1.3
    tryIt: go-dicom show ct-implicit.dcm::0010,0010
  - id: default-transfer-syntax
    term: the default transfer syntax
    simple: "Implicit VR Little Endian, 1.2.840.10008.1.2: the transfer syntax every DICOM implementation must support."
    deep: "PS3.5 §10.1 makes Implicit VR Little Endian the Default Transfer Syntax for DICOM, and PS3.5 Annex A.1 defines it: no VR in the Data Set, numbers little endian, Pixel Data as OW. Two AEs that agree on nothing else can fall back to it, as stage 4 shows. Its price is the dictionary: explicit VR is safer for elements the reader does not know."
    deepens: transfer-syntax
    sources: [filereader/, uid/]
    docs: https://dicom.nema.org/medical/dicom/current/output/chtml/part05/chapter_10.html#sect_10.1
    tryIt: go-dicom show ct-implicit.dcm::0002,0010

story:
